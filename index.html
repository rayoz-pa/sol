<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Asistente de Voz - Rayo</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #1a1a2e;
    color: #eaeaea;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  button {
    background: #6c5ce7;
    color: white;
    border: none;
    padding: 24px 48px;
    font-size: 20px;
    border-radius: 50px;
    cursor: pointer;
  }
  button:disabled { background: #444; }
  #status { margin-top: 30px; font-size: 16px; opacity: 0.8; max-width: 500px; text-align: center; }
  #momento { margin-top: 10px; font-size: 13px; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>

<button id="startBtn">Activar Sol</button>
<button id="stopBtn" style="background: #444; padding: 12px 28px; font-size: 14px; margin-top: 12px;">Silenciar a Sol</button>
<div id="status">Presiona el botón para comenzar</div>
<div id="momento"></div>

<script>
// URL real de tu Worker
const WORKER_URL = "https://bitter-boat-7e89.rayo-pizarroa.workers.dev/";

// La clave ya NO vive escrita en el código.
// Se pide una sola vez (por navegador/dispositivo) y queda guardada en localStorage.
// Debe coincidir con el secreto CLAVE_COMPARTIDA que configuraste en Cloudflare
// (wrangler secret put CLAVE_COMPARTIDA).
function obtenerClave() {
  let clave = localStorage.getItem("rayo_clave_acceso");
  if (!clave) {
    clave = prompt("Ingresa tu clave de acceso (solo se pide una vez en este navegador):");
    if (clave) {
      clave = clave.trim();
      localStorage.setItem("rayo_clave_acceso", clave);
    }
  }
  return clave;
}
const CLAVE_COMPARTIDA = obtenerClave();

// Voz fija elegida: Google español
const NOMBRE_VOZ = "Google español";
let vozSeleccionada = null;

function cargarVoz() {
  const voces = speechSynthesis.getVoices();
  vozSeleccionada = voces.find(v => v.name === NOMBRE_VOZ) || null;
}
speechSynthesis.onvoiceschanged = cargarVoz;
cargarVoz();

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const statusDiv = document.getElementById("status");
const momentoDiv = document.getElementById("momento");
let recognitionActivo = null; // referencia al reconocimiento en curso (conversación activa), para poder detenerlo desde fuera

let conversationHistory = [];
let conversacionIniciada = false;

function detectarMomento() {
  const hora = new Date().getHours();
  if (hora >= 6 && hora < 13) return "manana";
  if (hora >= 13 && hora < 20) return "mediodia";
  return "cierre";
}

let momento = detectarMomento();
const saludosPorMomento = {
  manana: "Buen día, Rayo.",
  mediodia: "Hola Rayo, ¿cómo va tu día?",
  cierre: "Hola Rayo, ¿cómo terminas el día?",
};

momentoDiv.textContent = "Momento: " + momento;

function hablar(texto, callback) {
  const utterance = new SpeechSynthesisUtterance(texto);
  if (vozSeleccionada) {
    utterance.voice = vozSeleccionada;
    utterance.lang = vozSeleccionada.lang;
  } else {
    utterance.lang = "es-ES";
  }
  utterance.onend = callback;
  speechSynthesis.speak(utterance);
}

function separarRespuesta(textoCompleto) {
  const marcador = "DATOS_JSON:";
  const idx = textoCompleto.indexOf(marcador);
  if (idx === -1) {
    return { textoHablado: textoCompleto, datosJson: null };
  }
  const textoHablado = textoCompleto.slice(0, idx).trim();
  const jsonTexto = textoCompleto.slice(idx + marcador.length).trim();
  let datosJson = null;
  try {
    datosJson = JSON.parse(jsonTexto);
  } catch (e) {
    console.log("No se pudo parsear DATOS_JSON:", jsonTexto);
  }
  return { textoHablado, datosJson };
}

// Detección flexible: basta con decir "sol" junto con cualquier raíz de detención,
// sin importar la conjugación exacta (detente, detenerte, deténte, etc.)
const RAICES_DETENER = ["deten", "pausa", "desactiv", "silencio", "deja de escuchar"];

function esFraseDeDetencion(textoLower) {
  const contieneSol = textoLower.includes("sol");
  const contieneRaizDeDetencion = RAICES_DETENER.some(raiz => textoLower.includes(raiz));
  return contieneSol && contieneRaizDeDetencion;
}

function escuchar() {
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "es-ES";
  recognition.continuous = true;
  recognition.interimResults = true;
  recognitionActivo = recognition;

  let transcriptFinal = "";
  let silencioTimer = null;
  let topeMaximoTimer = null;
  let ultimaLongitudTexto = 0;
  const TIEMPO_SILENCIO_MS = 2000; // espera ~2s de silencio real antes de considerar que terminaste de hablar
  const TOPE_MAXIMO_MS = 15000; // red de seguridad: nunca escucha más de 15s seguidos, pase lo que pase

  statusDiv.textContent = "Escuchando...";

  function reiniciarTimerSilencio() {
    if (silencioTimer) clearTimeout(silencioTimer);
    silencioTimer = setTimeout(() => {
      recognition.stop();
    }, TIEMPO_SILENCIO_MS);
  }

  topeMaximoTimer = setTimeout(() => {
    recognition.stop();
  }, TOPE_MAXIMO_MS);

  recognition.onresult = (event) => {
    let interim = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const texto = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        transcriptFinal += texto + " ";
      } else {
        interim += texto;
      }
    }
    const textoActual = (transcriptFinal + interim).trim();
    statusDiv.textContent = 'Escuchando: "' + textoActual + '"';

    // Solo reinicia el temporizador si de verdad llegó contenido nuevo,
    // no ante cualquier evento vacío o repetido que mande el navegador.
    if (textoActual.length > ultimaLongitudTexto) {
      ultimaLongitudTexto = textoActual.length;
      reiniciarTimerSilencio();
    }
  };

  recognition.onend = () => {
    if (silencioTimer) clearTimeout(silencioTimer);
    if (topeMaximoTimer) clearTimeout(topeMaximoTimer);
    const textoCompleto = transcriptFinal.trim();
    const textoNormalizado = textoCompleto.toLowerCase();

    if (esFraseDeDetencion(textoNormalizado)) {
      detenerTodoPorRayo();
      return; // corta el ciclo sin llamar a Claude
    }

    if (textoCompleto) {
      statusDiv.textContent = 'Dijiste: "' + textoCompleto + '"';
      enviarAClaude(textoCompleto);
    } else {
      // No se detectó nada útil, sigue escuchando sin pedir clic
      escuchar();
    }
  };

  recognition.onerror = (event) => {
    if (silencioTimer) clearTimeout(silencioTimer);
    statusDiv.textContent = "Error escuchando: " + event.error;
    startBtn.disabled = false;
    startBtn.textContent = "Responder";
  };

  recognition.start();
  reiniciarTimerSilencio();
}

async function enviarAClaude(texto) {
  statusDiv.textContent = "Pensando...";

  let data;
  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Rayo-Key": CLAVE_COMPARTIDA,
      },
      body: JSON.stringify({
        userText: texto,
        conversationHistory: conversationHistory,
        momento: momento,
      }),
    });

    if (!response.ok) {
      throw new Error("El servidor respondió con estado " + response.status);
    }

    data = await response.json();
  } catch (err) {
    console.log("Error de red al hablar con el Worker:", err);
    statusDiv.textContent = "Hubo un problema de conexión. Presiona el botón para reintentar.";
    startBtn.disabled = false;
    startBtn.textContent = "Reintentar";
    conversationHistory = [];
    conversacionIniciada = false;
    iniciarEscuchaWake();
    return;
  }

  if (data.error) {
    console.log("Error del Worker:", data.error);
    statusDiv.textContent = "Error: " + data.error;
    startBtn.disabled = false;
    startBtn.textContent = "Responder";
    return;
  }

  const { textoHablado, datosJson } = separarRespuesta(data.reply);

  if (data.cambiarMomentoA) {
    momento = data.cambiarMomentoA;
    momentoDiv.textContent = "Momento: " + momento;
  }

  conversationHistory = data.messages;
  conversationHistory.push({ role: "assistant", content: data.reply });

  if (data.conversacionTerminada) {
    console.log("Conversación cerrada. Guardado en Notion:", data.guardadoEnNotion);
  }

  statusDiv.textContent = textoHablado;
  hablar(textoHablado, () => {
    if (data.conversacionTerminada) {
      // Conversación cerrada (con o sin datos guardados) — vuelve a estado de reposo,
      // reactivando la escucha pasiva de la palabra clave "Sol"
      startBtn.disabled = false;
      startBtn.textContent = "Nueva conversación";
      conversationHistory = [];
      conversacionIniciada = false;
      iniciarEscuchaWake();
    } else {
      // Conversación sigue — escucha automáticamente, sin necesitar clic
      escuchar();
    }
  });
}

let wakeRecognition = null;
let escuchandoWake = false;

function iniciarEscuchaWake() {
  if (escuchandoWake || conversacionIniciada) return;
  wakeRecognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  wakeRecognition.lang = "es-ES";
  wakeRecognition.continuous = true;
  wakeRecognition.interimResults = true; // para diagnosticar y reaccionar más rápido
  escuchandoWake = true;

  wakeRecognition.onresult = (event) => {
    if (conversacionIniciada) return; // ya se disparó una conversación, ignora eventos adicionales de esta misma frase

    let textoCompleto = "";
    for (let i = 0; i < event.results.length; i++) {
      textoCompleto += event.results[i][0].transcript + " ";
    }
    const textoLower = textoCompleto.toLowerCase();
    statusDiv.textContent = 'Escuchando fondo: "' + textoCompleto.trim() + '"';

    if (esFraseDeDetencion(textoLower)) {
      detenerTodoPorRayo();
      return;
    }

    if (textoLower.includes("sol")) {
      detenerEscuchaWake();
      iniciarConversacion("wake");
    }
  };

  wakeRecognition.onend = () => {
    escuchandoWake = false;
    // Se reinicia sola mientras no haya conversación activa, para seguir atenta a la palabra clave
    if (!conversacionIniciada) {
      iniciarEscuchaWake();
    }
  };

  wakeRecognition.onerror = (event) => {
    escuchandoWake = false;
    console.log("Error en escucha pasiva:", event.error);
    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      statusDiv.textContent = "Necesito permiso de micrófono para escuchar 'Sol'. Revisa el ícono de micrófono en la barra de direcciones.";
      return; // no reintentar si el problema es de permisos
    }
    if (event.error !== "no-speech" && event.error !== "aborted") {
      // Muestra brevemente cualquier error inesperado antes de reintentar
      statusDiv.textContent = "Error de escucha (" + event.error + "), reintentando...";
    }
    // Errores comunes y esperables (ej. "no-speech" tras un rato de silencio) —
    // simplemente reiniciamos la escucha, sin interrumpir nada.
    if (!conversacionIniciada) {
      iniciarEscuchaWake();
    }
  };

  wakeRecognition.start();
  statusDiv.textContent = "Di \"Sol\" cuando quieras hablar conmigo.";
}

function detenerEscuchaWake() {
  if (wakeRecognition) {
    wakeRecognition.onend = null; // evita que se reinicie sola al detenerla a propósito
    wakeRecognition.stop();
  }
  escuchandoWake = false;
}

function yaSaludoHoy() {
  const hoy = new Date().toLocaleDateString("en-CA");
  return localStorage.getItem("rayo_saludo_fecha") === hoy;
}
function marcarSaludoHoy() {
  const hoy = new Date().toLocaleDateString("en-CA");
  localStorage.setItem("rayo_saludo_fecha", hoy);
}

function iniciarConversacion(origen) {
  if (conversacionIniciada) return; // ya hay una conversación en curso, ignora disparos duplicados
  startBtn.disabled = true;
  conversacionIniciada = true;
  statusDiv.textContent = "Conectando...";
  const yaSaludado = yaSaludoHoy();
  const tipo = origen === "rutina" ? "rutina programada" : "palabra clave";
  const disparador = `(inicio por ${tipo}, ${yaSaludado ? "ya conversamos hoy" : "primera vez hoy"})`;
  marcarSaludoHoy();
  enviarAClaude(disparador);
}

function detenerTodoPorRayo() {
  if (recognitionActivo) {
    recognitionActivo.onend = null;
    recognitionActivo.onresult = null;
    try { recognitionActivo.abort(); } catch (e) {}
    recognitionActivo = null;
  }
  detenerEscuchaWake();
  speechSynthesis.cancel();
  conversationHistory = [];
  conversacionIniciada = false;
  sesionActiva = false;
  startBtn.disabled = false;
  startBtn.textContent = "Activar Sol";
  statusDiv.textContent = 'Sol está en pausa. Presiona "Activar Sol" cuando quieras retomar.';
}

stopBtn.addEventListener("click", detenerTodoPorRayo);

let sesionActiva = false;

startBtn.textContent = "Activar Sol";
statusDiv.textContent = 'Presiona el botón una vez para activar a Sol por hoy';

startBtn.addEventListener("click", () => {
  if (!sesionActiva) {
    sesionActiva = true;
    startBtn.textContent = "Hablar ahora";
    iniciarEscuchaWake();
    return;
  }
  if (!conversacionIniciada) {
    detenerEscuchaWake();
    iniciarConversacion("wake");
  } else {
    startBtn.disabled = true;
    escuchar();
  }
});

// --- Scheduler interno de rutinas ---
// Como la página se deja abierta todo el día, no hace falta reabrir Chrome
// a cada horario — solo revisamos el reloj y disparamos la conversación sola.
const HORARIOS_RUTINA = [
  { hora: 9, minuto: 45, momento: "manana" },
  { hora: 14, minuto: 0, momento: "mediodia" },
  { hora: 22, minuto: 0, momento: "cierre" },
];
let ultimaRutinaDisparada = null; // ej. "2026-08-02_manana", evita disparar dos veces el mismo momento el mismo día

function revisarHorarioRutinas() {
  if (conversacionIniciada) return; // no interrumpir si ya hay una conversación en curso

  const ahora = new Date();
  const fechaHoy = ahora.toLocaleDateString("en-CA");

  for (const r of HORARIOS_RUTINA) {
    if (ahora.getHours() === r.hora && ahora.getMinutes() === r.minuto) {
      const clave = `${fechaHoy}_${r.momento}`;
      if (ultimaRutinaDisparada === clave) continue; // ya se disparó este momento hoy

      ultimaRutinaDisparada = clave;
      momento = r.momento;
      momentoDiv.textContent = "Momento: " + momento;
      detenerEscuchaWake();
      iniciarConversacion("rutina");
      break;
    }
  }
}

setInterval(revisarHorarioRutinas, 20000); // revisa cada 20 segundos
</script>

</body>
</html>
